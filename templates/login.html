<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Ríos Pastries</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --rosa-claro: #fdf2f5;
            --rosa-fuerte: #e89bb0;
            --crema: #fff8f0;
            --dorado: #c9a961;
            --texto-oscuro: #4a4a4a;
            --texto-claro: #7a7a7a;
            --blanco: #ffffff;
            --error: #e74c3c;
            --exito: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--rosa-claro), var(--crema));
            color: var(--texto-oscuro);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            background: var(--blanco);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(232, 155, 176, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .auth-container h1 {
            font-family: 'Playfair Display', serif;
            color: var(--rosa-fuerte);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .auth-container p {
            color: var(--texto-claro);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: var(--texto-oscuro);
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--rosa-fuerte);
        }

        .btn-primary {
            width: 100%;
            background-color: var(--rosa-fuerte);
            color: white;
            padding: 0.9rem;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background-color: var(--dorado);
            transform: translateY(-2px);
        }

        .auth-links {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: var(--rosa-fuerte);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-links a:hover { text-decoration: underline; }

        .message {
            padding: 0.8rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        .message.error { background: #fdecea; color: var(--error); display: block; }
        .message.success { background: #eafaf1; color: var(--exito); display: block; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>Bienvenido 🧁</h1>
        <p>Inicia sesión para hacer tus pedidos y reservaciones</p>

        <div id="mensaje" class="message"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>

        <div class="auth-links">
            <p><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
            <p style="margin-top: 0.5rem;">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            <p style="margin-top: 1rem;"><a href="index.html" style="color: var(--texto-claro);"><i class="fas fa-arrow-left"></i> Volver al inicio</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensajeDiv = document.getElementById('mensaje');
            const btn = document.querySelector('.btn-primary');
            
            btn.textContent = 'Ingresando...';
            btn.disabled = true;
            mensajeDiv.className = 'message';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Conectando con tu API FastAPI
                const response = await fetch('http://127.0.0.1:8000 /api/usuarios/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password})
                });

                const data = await response.json();

                if (response.ok) {
                    mensajeDiv.className = 'message success';
                    mensajeDiv.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
                    // Guardar token en localStorage
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    
                    setTimeout(() => {
                        window.location.href = 'index.html'; // Redirigir al home
                    }, 1500);
                } else {
                    mensajeDiv.className = 'message error';
                    mensajeDiv.textContent = data.detail || 'Credenciales incorrectas';
                }
            } catch (error) {
                mensajeDiv.className = 'message error';
                mensajeDiv.textContent = 'Error de conexión con el servidor';
            } finally {
                btn.textContent = 'Iniciar Sesión';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
